<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="{{DESCRIPTION}}">
  <title>{{TITLE}} | Solomon Rajan</title>

  <!-- Google Fonts (Strict Google Sans & Material Symbols) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

  <!-- Core Google Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .google-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
  </style>
  <!-- Analytics -->
  <script defer src="../assets/js/umami.js" data-website-id="681f1338-c995-4dde-b9fd-a738a5c5d55f" data-host-url="https://cloud.umami.is"></script>
</head>
<body>

  <!-- Top App Bar -->
  <header class="google-app-bar">
    <div class="google-app-bar__left">
      <button class="google-menu-btn" id="sidebar-toggle" aria-label="Main menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <a href="/" class="google-logo">
        <span style="color: #F9A825; font-weight: 500;">Solomon Rajan</span>
        <span style="color: var(--google-text-secondary); font-size: 20px; margin-left: 4px;">Account</span>
      </a>
    </div>
    
    <div class="google-app-bar__right">
      <div class="google-apps-container">
        <button class="google-menu-btn" id="google-apps-toggle" aria-label="Google apps" title="Google apps">
          <span class="material-symbols-outlined">apps</span>
        </button>
        <div class="google-apps-dropdown" id="google-apps-dropdown">
          <div class="google-apps-header">
            <span>Your favourites</span>
          </div>
          <div class="google-apps-grid">
            <a href="https://github.com/solomonrajan" class="google-app-item" target="_blank">
              <img src="../logos/github.svg" alt="GitHub">
              <span>GitHub</span>
            </a>
            <a href="https://linkedin.com/in/solomonrajan" class="google-app-item" target="_blank">
              <img src="../logos/linkedin.svg" alt="LinkedIn">
              <span>LinkedIn</span>
            </a>
            <a href="https://liberapay.com/solomon.rajan" class="google-app-item" target="_blank">
              <img src="../logos/liberapay.svg" alt="Liberapay">
              <span>Liberapay</span>
            </a>
            <a href="#" class="google-app-item" target="_blank">
              <img src="../logos/kofi.svg" alt="Ko-fi">
              <span>Ko-fi</span>
            </a>
            <a href="#" class="google-app-item" target="_blank">
              <img src="../logos/buymeacoffee.svg" alt="Coffee">
              <span>Coffee</span>
            </a>
            <a href="#" class="google-app-item" target="_blank">
              <img src="../logos/gitlab.svg" alt="GitLab">
              <span>GitLab</span>
            </a>
            <a href="#" class="google-app-item" target="_blank">
              <img src="../logos/reddit.svg" alt="Reddit">
              <span>Reddit</span>
            </a>
            <a href="#" class="google-app-item" target="_blank">
              <img src="../logos/x.svg" alt="X">
              <span>X</span>
            </a>
            <a href="#" class="google-app-item" target="_blank">
              <img src="../logos/telegram.svg" alt="Telegram">
              <span>Telegram</span>
            </a>
          </div>
        </div>
      </div>
      <div class="google-avatar-ring"><img src="../images/profile.png" alt="Profile" class="google-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Solomon+Rajan&background=1a73e8&color=fff'"></div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="google-layout">
    
    <!-- Sidebar -->
    <aside class="google-sidebar" id="google-sidebar">
      <ul class="google-nav-list">
        <li class="google-nav-item">
          <a href="/" class="google-nav-link">
            <span class="material-symbols-outlined">account_circle</span>
            Home
          </a>
        </li>
        <li class="google-nav-item">
          <a href="/about" class="google-nav-link">
            <span class="material-symbols-outlined">badge</span>
            Personal info
          </a>
        </li>
        <li class="google-nav-item">
          <a href="/portfolio" class="google-nav-link">
            <span class="material-symbols-outlined">work</span>
            Portfolio
          </a>
        </li>
        <li class="google-nav-item">
          <a href="/blog" class="google-nav-link active">
            <span class="material-symbols-outlined">article</span>
            Blog
          </a>
        </li>
        <li class="google-nav-item">
          <a href="/contact" class="google-nav-link">
            <span class="material-symbols-outlined">contact_page</span>
            Contact
          </a>
        </li>
        <li class="google-nav-item">
          <a href="/updates" class="google-nav-link">
            <span class="material-symbols-outlined">update</span>
            Changelog
          </a>
        </li>
        <hr style="border: 0; border-top: 1px solid var(--google-border-color); margin: 8px 0;">
        <li class="google-nav-item google-theme-control-container">
          <div class="google-theme-segmented-control" id="theme-toggle-group">
            <button class="theme-btn" data-theme-value="system" aria-label="System theme" title="System Theme">
              <span class="material-symbols-outlined">monitor</span>
            </button>
            <button class="theme-btn" data-theme-value="light" aria-label="Light theme" title="Light Theme">
              <span class="material-symbols-outlined">light_mode</span>
            </button>
            <button class="theme-btn" data-theme-value="dark" aria-label="Dark theme" title="Dark Theme">
              <span class="material-symbols-outlined">dark_mode</span>
            </button>
          </div>
        </li>
      </ul>
    </aside>

    <!-- Content Area -->
    <main class="google-main-content">
      <div class="google-content-container">
        <div class="google-card">
          <div class="google-card-header">
            <h1 style="font-size: 28px; font-weight: 400; color: var(--google-text-primary); margin: 0 0 8px 0; line-height: 1.3;">{{TITLE}}</h1>
            <p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--google-text-secondary); font-size: 14px;">
              <span>{{DATE}}</span>
              <span style="font-size: 10px;">&bull;</span>
              <span>{{READ_TIME}}</span>
              <span style="font-size: 10px;">&bull;</span>
              <span>{{CATEGORY}}</span>
            </p>
          </div>
          <div class="google-card-body google-markdown" style="padding: 24px;">
{{CONTENT}}
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
