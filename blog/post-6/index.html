    transition: all 0.3s ease;

    cursor: pointer;
    color: var(--md-sys-color-on-surface);
    outline: none;
    user-select: none;

<body>
<div id="root">
</div>
<script id="global-link-target">
      document.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (a) {
          var href = a.getAttribute('href');
          if (href && href.startsWith('https://')) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          }
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (function() {
        let markdownHtml = "";
        fetch('post.md')
          .then(response => {
             if(response.ok) return response.text();
             throw new Error('No post.md found');
          })
          .then(text => {
             markdownHtml = marked.parse(text);
             injectMarkdown();
          })
          .catch(err => console.log('Markdown loading skipped:', err.message));

        function injectMarkdown() {
          if(!markdownHtml) return;
          const article = document.querySelector('.article-content');
          if (article && !article.hasAttribute('data-markdown-loaded')) {
             article.innerHTML = markdownHtml;
             article.setAttribute('data-markdown-loaded', 'true');
             console.log("Markdown injected successfully.");
          }
        }

        const observer = new MutationObserver(mutations => {
          injectMarkdown();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
</body>
