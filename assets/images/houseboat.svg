  <rect x="95" y="30" width="15" height="15" rx="2" />
  <rect x="120" y="30" width="15" height="15" rx="2" />
  <!-- Bamboo poles / lines -->
  <line x1="45" y1="50" x2="45" y2="25" />
  <line x1="155" y1="50" x2="155" y2="25" />
  <!-- Water ripples -->
