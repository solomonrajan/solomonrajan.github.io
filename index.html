<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <!-- Google Material Icons 'web_asset_off' as Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' height='24' viewBox='0 -960 960 960' width='24' fill='%23FFB300'><path d='M840-272 688-424v-336H184L40-904l56-56 760 760-56 56-112-112ZM768-40q-33 0-56.5-23.5T688-120v-55L144-719q-23 23-23 55v544q0 33 23.5 56.5T200-40h568Zm-155-76Z'/></svg>">
    <!-- Google Fonts for Material Design 3 typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Material Design 3 Color Palette (Amber Light Theme) */
            --md-sys-color-background: #FFFBF2;
            --md-sys-color-on-background: #201A10;
            --md-sys-color-surface: #FFFBF2;
            --md-sys-color-on-surface: #201A10;
            --md-sys-color-on-surface-variant: #514534;
            --md-sys-color-primary: #FFB300;
            --md-sys-color-on-primary: #402D00;
            --md-sys-color-primary-container: #FFDF99;
            --md-sys-color-on-primary-container: #261A00;
            --md-sys-color-secondary-container: #FFE0C2;
            --md-sys-color-on-secondary-container: #2E1500;
            --md-sys-color-tertiary-container: #F6E0B3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Material You Decorative Background Shapes */
        .shape {
            position: absolute;
            z-index: 0;
            will-change: transform;
            /* Use a single hardware-accelerated transform animation */
            animation: float 25s infinite linear; 
        }

        /* Organic Blob 1 */
        .shape-1 {
            width: 55vw;
            height: 55vw;
            background-color: var(--md-sys-color-primary-container);
            top: -15%;
            left: -10%;
            /* Static organic shape */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation-duration: 25s;
        }

        /* Organic Blob 2 */
        .shape-2 {
            width: 45vw;
            height: 45vw;
            background-color: var(--md-sys-color-tertiary-container);
            bottom: -10%;
            right: -5%;
            /* Static organic shape */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation-duration: 22s;
            animation-direction: reverse;
        }
        
        /* Organic Blob 3 */
        .shape-3 {
            width: 35vw;
            height: 35vw;
            background-color: var(--md-sys-color-secondary-container);
            top: 15%;
            left: 35%; /* Positioned directly behind the frosted glass */
            /* Static organic shape */
            border-radius: 50% 50% 30% 70% / 50% 60% 40% 50%;
            animation-duration: 28s;
        }

        @keyframes float {
            0% { transform: rotate(0deg) scale(1) translate3d(0, 0, 0); }
            33% { transform: rotate(120deg) scale(1.1) translate3d(20px, 30px, 0); }
            66% { transform: rotate(240deg) scale(0.9) translate3d(-20px, 10px, 0); }
            100% { transform: rotate(360deg) scale(1) translate3d(0, 0, 0); }
        }

        /* Shattered Glassmorphic Card */
        main {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.1) 100%);
            padding: 56px 48px;
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(32px) saturate(140%);
            -webkit-backdrop-filter: blur(32px) saturate(140%);
            text-align: center;
            /* Jagged, broken glass shape */
            clip-path: polygon(2% 0%, 97% 3%, 100% 20%, 98% 45%, 100% 75%, 95% 100%, 3% 98%, 0% 80%, 2% 40%, 0% 15%);
        }

        /* Large cracks on the main card */
        main::before, main::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 6px rgba(255,255,255,0.4);
            pointer-events: none;
            z-index: 0;
        }

        main::before {
            width: 2px;
            height: 120%;
            top: -10%;
            left: 25%;
            transform: rotate(22deg);
        }

        main::after {
            width: 70%;
            height: 1px;
            top: 60%;
            left: 20%;
            transform: rotate(-12deg);
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.8) 50%, transparent 100%);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border-radius: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.25rem;
            line-height: 2.75rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--md-sys-color-on-background);
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.125rem;
            line-height: 1.75rem;
            font-weight: 400;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 40px;
        }

        /* Broken Glass Button */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: var(--md-sys-color-on-background);
            height: 48px;
            padding: 0 32px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9375rem;
            letter-spacing: 0.1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            /* Glass edges */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            /* Frost */
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            /* Jagged, broken shards shape */
            clip-path: polygon(2% 0%, 98% 2%, 100% 15%, 96% 35%, 100% 70%, 95% 100%, 0% 98%, 4% 75%, 0% 45%, 3% 20%);
        }

        /* Shattered crack details */
        .btn-primary::before, .btn-primary::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 4px rgba(255,255,255,0.5);
            pointer-events: none;
        }

        /* Primary crack */
        .btn-primary::before {
            width: 1.5px;
            height: 150%;
            top: -25%;
            left: 65%;
            transform: rotate(38deg);
        }

        /* Secondary branch crack */
        .btn-primary::after {
            width: 60%;
            height: 1px;
            top: 55%;
            left: 15%;
            transform: rotate(-18deg);
            background: linear-gradient(90deg, rgba(255,255,255,0.8) 0%, transparent 100%);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #000;
            /* Shards crunch on hover */
            clip-path: polygon(0% 2%, 100% 0%, 94% 20%, 98% 40%, 95% 80%, 100% 95%, 2% 100%, 0% 65%, 5% 40%, 0% 15%);
            transform: scale(0.98);
        }

        .btn-primary:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        .signature-container {
            margin-top: 40px;
            text-align: center;
        }

        .signature-container img {
            max-width: 180px;
            opacity: 0.85;
            transition: opacity 0.3s;
        }

        .signature-container img:hover {
            opacity: 1;
        }

        .site-footer {
            margin-top: 48px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: var(--md-sys-color-on-background);
            opacity: 0.7;
        }

        .site-footer p {
            margin: 4px 0;
            font-size: 0.75rem;
            line-height: 1.4;
            color: inherit;
        }

        .site-footer a {
            color: var(--md-sys-color-on-surface);
            text-decoration: none;
            font-weight: 600;
        }

        .site-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            main {
                padding: 40px 24px;
                border-radius: 24px;
            }
            h1 {
                font-size: 2rem;
                line-height: 2.5rem;
            }
            .shape-1 {
                width: 90vw;
                height: 90vw;
            }
            .shape-2 {
                width: 70vw;
                height: 70vw;
            }
            .shape-3 {
                display: none; /* Hide on small screens to reduce clutter */
            }
        }
    </style>
</head>
<body>

    <!-- Material You Decorative Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <main>
        <div class="icon-container">
            <!-- Material Symbol: construction -->

        </div>

</body>
</html>
