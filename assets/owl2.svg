<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bodyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9395D3" />
      <stop offset="100%" style="stop-color:#7174B8" />
    </linearGradient>
    <linearGradient id="bellyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E2D1F9" />
      <stop offset="100%" style="stop-color:#CBB2ED" />
    </linearGradient>
  </defs>
  <style>
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    .owl { animation: sway 3s ease-in-out infinite; transform-origin: 50px 85px; }
    .eyes { animation: blink 4s infinite; transform-origin: 50px 45px; }
  </style>
  <g class="owl">
    <!-- Body -->
    <rect x="25" y="30" width="50" height="55" rx="25" fill="url(#bodyGrad2)" />
    <!-- Ears -->
    <path d="M 25 45 Q 15 20 35 30 Z" fill="#7174B8" />
    <path d="M 75 45 Q 85 20 65 30 Z" fill="#7174B8" />
    <!-- Belly -->
    <ellipse cx="50" cy="65" rx="18" ry="20" fill="url(#bellyGrad2)" />
    <!-- Eyes Base -->
    <g class="eyes">
      <circle cx="35" cy="45" r="14" fill="#FFFFFF" />
      <circle cx="65" cy="45" r="14" fill="#FFFFFF" />
      <!-- Pupils -->
      <circle cx="38" cy="45" r="6" fill="#2C3E50" />
      <circle cx="62" cy="45" r="6" fill="#2C3E50" />
      <!-- Highlights -->
      <circle cx="36" cy="43" r="2" fill="#FFFFFF" />
      <circle cx="60" cy="43" r="2" fill="#FFFFFF" />
    </g>
    <!-- Beak -->
    <polygon points="45,52 55,52 50,60" fill="#FFC300" />
    <!-- Wings -->
    <path d="M 25 50 Q 15 60 25 75 Z" fill="#7174B8" />
    <path d="M 75 50 Q 85 60 75 75 Z" fill="#7174B8" />
  </g>
</svg>
