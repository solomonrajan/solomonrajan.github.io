<!-- 3. ANTI-CLICKJACK & ROUTING                -->

<style id="antiClickjack">body{display:none !important;}</style>
<script type="text/javascript">
   if (self === top) {
       var antiClickjack = document.getElementById("antiClickjack");
       antiClickjack.parentNode.removeChild(antiClickjack);
   } else {
       top.location = self.location;
   }
</script>
<script>
  (function() {
    var path = window.location.pathname;
    if (path.endsWith('/index.html')) {
      window.history.replaceState(null, '', path.replace(/\/index\.html$/, '/') + window.location.search + window.location.hash);
    } else if (path.endsWith('.html')) {
      window.history.replaceState(null, '', path.replace(/\.html$/, '') + window.location.search + window.location.hash);
    }
  })();
</script>

<script id="global-link-target">
      document.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (a) {
          var href = a.getAttribute('href');
          if (href && href.startsWith('https://')) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          }
        }
      });
    </script>
