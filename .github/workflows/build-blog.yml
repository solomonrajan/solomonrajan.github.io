name: Build Blog

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'assets/blog/content/**'
      - 'assets/scripts/build-blog.js'
      - 'assets/blog/template.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Blog Posts
        run: npm run build:blog

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(blog): auto-build static HTML from MDX"
          file_pattern: "assets/blog/*.html"
