<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bodyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#83C5BE" />
      <stop offset="100%" style="stop-color:#4DA39B" />
    </linearGradient>
    <linearGradient id="bellyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E5F9E0" />
      <stop offset="100%" style="stop-color:#BDE0B7" />
    </linearGradient>
  </defs>
  <style>
    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-12px) scale(1.05); }
      60% { transform: translateY(0) scale(0.95); }
    }
    .owl { animation: jump 1.5s ease-in-out infinite; transform-origin: 50px 85px; }
  </style>
  <g class="owl">
    <!-- Body -->
    <rect x="25" y="30" width="50" height="55" rx="25" fill="url(#bodyGrad3)" />
    <!-- Ears -->
    <path d="M 25 45 Q 15 20 35 30 Z" fill="#4DA39B" />
    <path d="M 75 45 Q 85 20 65 30 Z" fill="#4DA39B" />
    <!-- Belly -->
    <ellipse cx="50" cy="65" rx="18" ry="20" fill="url(#bellyGrad3)" />
    <!-- Eyes base -->
    <circle cx="35" cy="45" r="14" fill="#FFFFFF" />
    <circle cx="65" cy="45" r="14" fill="#FFFFFF" />
    <!-- Pupils (Looking up) -->
    <circle cx="35" cy="42" r="6" fill="#2C3E50" />
    <circle cx="65" cy="42" r="6" fill="#2C3E50" />
    <!-- Eye Highlights -->
    <circle cx="33" cy="40" r="2" fill="#FFFFFF" />
    <circle cx="63" cy="40" r="2" fill="#FFFFFF" />
    <!-- Beak -->
    <polygon points="45,52 55,52 50,60" fill="#FFC300" />
    <!-- Wings (Flapping slightly) -->
    <path d="M 25 50 Q 5 50 15 65 Z" fill="#4DA39B" />
    <path d="M 75 50 Q 95 50 85 65 Z" fill="#4DA39B" />
  </g>
</svg>
